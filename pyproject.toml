[project]
name = "hddl"
version = "0.1.0"
description = "Robustesse de LeJEPA aux données corrompues"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.7",
    "torchvision>=0.22",
    "timm>=1.0",
    "numpy",
    "scikit-learn",
    "matplotlib",
    "pillow",
    "imagecorruptions",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
